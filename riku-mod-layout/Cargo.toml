[package]
name = "riku-mod-layout"
version = "0.2.0"
edition = "2024"
description = "Módulo de layouts de Riku (GDSII/OASIS): diff geométrico, paletas por PDK y backend del visor"
license = "MIT"
publish = false

[dependencies]
gdstk-rs = { path = "../external/gdstk/rust" }
viewer-core = { path = "../viewer-core" }
async-trait = "0.1"
thiserror = "2.0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
# Los ejemplos de medición arman el índice como el visor: en paralelo.
viewer-core = { path = "../viewer-core", features = ["parallel"] }
