[package]
name = "riku-kernel"
version = "0.1.0"
edition = "2024"
description = "Núcleo de Riku: tipos de dominio neutros (sin conocer ningún formato de archivo)"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Contrato del visor: un módulo puede ofrecer su backend.
viewer-core = { path = "../viewer-core" }
