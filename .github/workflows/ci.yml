name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # El Release la corre antes de compilar: no se publica con tests en rojo.
  workflow_call:

concurrency:
  # Llamada desde el Release, `github.workflow` es "Release": no se cancelan entre sí.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # `cargo fmt` pide los metadatos del workspace, que incluyen las dependencias por path (external/).
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Por paquete y no `--all`: `--all` también formatea las dependencias por path (external/).
      - name: cargo fmt --check
        run: cargo fmt --check -p viewer-core -p riku-kernel -p riku-mod-layout -p riku

  clippy:
    name: clippy (sin bloquear)
    runs-on: ubuntu-24.04
    # Los avisos se leen en el log; todavía no ponen la CI en rojo.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zlib1g-dev libqhull-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets --locked

  test:
    name: test (linux)
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zlib1g-dev libqhull-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Identidad git para los tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (workspace)
        run: cargo test --workspace --locked
      - name: riku sin visor (--no-default-features)
        run: cargo build --locked -p riku --no-default-features
      - name: riku con un solo módulo (layouts / Xschem)
        run: |
          cargo build --locked -p riku --no-default-features --features layout
          cargo build --locked -p riku --no-default-features --features xschem
          cargo build --locked -p riku --no-default-features --features layout,gui
      - name: El núcleo no depende de ningún formato
        run: |
          if cargo tree --locked -p riku-kernel -e normal | grep -E "riku-mod-layout|xschem-viewer|gdstk-rs"; then
            echo "::error::riku-kernel depende de un módulo o motor de formato"; exit 1
          fi

  xschem-compat:
    name: xschem-viewer-rust (viewer-core-compat)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: external/xschem-viewer-rust -> target
      - name: cargo check
        working-directory: external/xschem-viewer-rust
        run: cargo check --features viewer-core-compat
