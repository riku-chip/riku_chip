name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zlib1g-dev libqhull-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Identidad git para los tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (workspace)
        run: cargo test --workspace --locked
      - name: riku sin visor (--no-default-features)
        run: cargo build --locked -p riku --no-default-features

  xschem-compat:
    name: xschem-viewer-rust (viewer-core-compat)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: external/xschem-viewer-rust -> target
      - name: cargo check
        working-directory: external/xschem-viewer-rust
        run: cargo check --features viewer-core-compat

  # Exploratorio (#12 de docs/roadmap/pendientes.md): no bloquea el merge
  # hasta que pase de forma estable. gdstk-rs busca zlib y qhull en vcpkg.
  windows:
    name: windows (no bloqueante)
    runs-on: windows-latest
    continue-on-error: true
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: zlib y qhull (vcpkg)
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH
          vcpkg install zlib:x64-windows qhull:x64-windows
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (workspace)
        run: cargo test --workspace --locked
