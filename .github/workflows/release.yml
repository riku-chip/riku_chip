name: Release

# Un tag v* (p. ej. v0.2.0) compila el ejecutable único de Linux y publica
# riku-<versión>-linux-x86_64.tar.gz, riku_<versión>_amd64.deb y
# SHA256SUMS en GitHub Releases. Con workflow_dispatch solo deja los
# artefactos en el run, sin publicar.
#
# Antes corre la CI entera sobre el mismo commit (tests, combinaciones de
# features, el crate de Carlos): si algo falla, no se compila ni se publica.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  linux:
    needs: ci
    # 22.04 (glibc 2.35): el binario corre en Ubuntu 22.04+, Debian 12+,
    # Fedora 36+ y el contenedor iic-osic-tools.
    runs-on: ubuntu-22.04
    env:
      GDSTK_STATIC: "1"
      QHULL_DIR: /opt/qhull-static
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake zlib1g-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: qhull estático
        run: |
          curl -sL https://github.com/qhull/qhull/archive/refs/tags/v8.0.2.tar.gz | tar xz
          cmake -S qhull-8.0.2 -B qhull-build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_PREFIX=$QHULL_DIR -Wno-dev
          cmake --build qhull-build -j
          sudo cmake --install qhull-build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-static
      - name: Compilar riku
        run: cargo build --release --locked -p riku

      - name: Verificar dependencias del binario
        run: |
          B=target/release/riku
          ldd $B
          extra=$(ldd $B | awk '{print $1}' | grep -v -E '^(linux-vdso\.|/lib64/ld-linux|/lib/ld-linux|(libc|libm|libgcc_s|libdl|libpthread|librt)\.)' || true)
          if [ -n "$extra" ]; then echo "::error::dependencias no permitidas: $extra"; exit 1; fi
          ls -la $B
      - name: Pruebas de humo
        run: |
          B=$PWD/target/release/riku
          $B --version
          git config --global user.name ci; git config --global user.email ci@localhost
          mkdir /tmp/smoke && cd /tmp/smoke && git init -q
          cp $GITHUB_WORKSPACE/riku-mod-layout/tests/fixtures/hier_inv_a.gds layout.gds && git add . && git commit -qm a
          cp $GITHUB_WORKSPACE/riku-mod-layout/tests/fixtures/hier_inv_b.gds layout.gds && git add . && git commit -qm b
          $B diff HEAD~1 HEAD layout.gds -f json | grep -q '"type": "geometry"'
          $B diff HEAD~1 HEAD layout.gds -f json | grep -q '"schema": "riku-diff/v2"'
          # Magic: el cambio de la sub-celda se ve en el top del mismo commit.
          printf 'magic\ntech sky130A\nuse inv  i0\ntransform 1 0 0 0 1 0\nbox 0 0 1 1\n' > top.mag
          printf 'magic\ntech sky130A\n<< metal1 >>\nrect 0 0 400 400\n' > inv.mag
          git add . && git commit -qm c
          printf 'magic\ntech sky130A\n<< metal1 >>\nrect 0 0 400 800\n' > inv.mag
          git commit -qam d
          $B diff HEAD~1 HEAD top.mag -f json | grep -q '"layer_name": "metal1"'
          if $B gui layout.gds 2>err.txt; then echo "::error::gui sin DISPLAY debía fallar"; exit 1; fi
          grep -q "escritorio gráfico" err.txt

      - name: Empaquetar
        id: pkg
        run: |
          VER=$(target/release/riku --version | awk '{print $2}')
          echo "ver=$VER" >> $GITHUB_OUTPUT
          D=riku-$VER-linux-x86_64
          mkdir -p dist/$D
          cp target/release/riku packaging/install.sh packaging/riku.desktop packaging/riku.svg README.md LICENSE dist/$D/
          chmod +x dist/$D/install.sh
          tar -C dist -czf dist/$D.tar.gz $D
          cargo install cargo-deb --locked
          cargo deb -p riku --no-build --no-strip -o dist/
          cd dist && sha256sum *.tar.gz *.deb > SHA256SUMS && ls -la && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: riku-${{ steps.pkg.outputs.ver }}-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.deb dist/SHA256SUMS --title "Riku $GITHUB_REF_NAME" --generate-notes
