# Textos de la línea de comandos. Cada clave lleva `en` y `es`; el inglés
# es el idioma por defecto (RIKU_LANG=es para español). Variables: %{nombre}.
_version: 2
doctor.title:
  en: "Riku Doctor — environment check"
  es: "Riku Doctor — Diagnóstico del Entorno"
doctor.repo:
  en: "Git repository"
  es: "Repositorio Git"
doctor.no_repo:
  en: "Not found — diff/log will not work"
  es: "No detectado — diff/log no funcionarán"
doctor.config_ok:
  en: "%{file}: project options"
  es: "%{file}: opciones del proyecto"
doctor.config_none:
  en: "%{file}: none (default options)"
  es: "%{file}: no hay (opciones por defecto)"
doctor.no_symbols:
  en: "No symbol source — components will render as empty boxes"
  es: "Sin fuente de símbolos — los componentes se renderizarán como cajas vacías"
doctor.modules:
