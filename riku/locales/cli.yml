  en: "diff -f visual needs a file: riku diff [A] [B] <file> -f visual"
  es: "diff -f visual necesita un archivo: riku diff [A] [B] <archivo> -f visual"
err.json_v1_one_file:
  en: "-f json-v1 only works for one file; use -f json (schema riku-diff-set/v1)"
  es: "-f json-v1 solo sirve para un archivo; usa -f json (schema riku-diff-set/v1)"
err.too_many_targets:
  en: "diff takes at most 3 arguments: [A] [B] [FILE]"
  es: "diff acepta a lo más 3 argumentos: [A] [B] [ARCHIVO]"
err.show_visual_needs_file:
  en: "show -f visual needs a file: riku show <commit> <file> -f visual"
  es: "show -f visual necesita un archivo: riku show <commit> <archivo> -f visual"
err.initial_commit:
  en: "%{commit} is the initial commit: there is no previous version to compare with. To view it: riku open %{file}"
  es: "%{commit} es el commit inicial: no hay versión anterior con la que comparar. Para verlo: riku open %{file}"
err.show_no_v1:
  en: "show has no json-v1 output; use -f json (schema riku-show/v1)"
  es: "show no tiene salida json-v1; usa -f json (schema riku-show/v1)"
err.no_display:
