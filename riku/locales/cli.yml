  es: "Navegación:"
shell.h_ls:
  en: "list .sch, .sym, .gds, .oas, .mag and .raw"
  es: "listar .sch, .sym, .gds, .oas, .mag y .raw"
shell.h_cd:
  en: "change folder"
  es: "cambiar de carpeta"
shell.h_git:
  en: "Versions:"
  es: "Versiones:"
shell.h_status:
  en: "what changed on disk since HEAD"
  es: "qué cambió en el disco respecto a HEAD"
shell.h_diff:
  en: "compare versions (without B: the disk; without A: HEAD)"
  es: "comparar versiones (sin B: el disco; sin A: HEAD)"
shell.h_visual:
  en: "the same, in the viewer"
  es: "lo mismo, en el visor"
shell.h_show:
  en: "changes of a commit against its parent"
  es: "cambios de un commit respecto a su padre"
shell.h_log:
  en: "history with a semantic summary per commit"
  es: "historial con resumen semántico por commit"
shell.h_viewer:
  en: "Viewer:"
  es: "Visor:"
shell.h_open:
  en: "open the viewer"
  es: "abrir el visor"
shell.h_env:
  en: "Environment:"
  es: "Entorno:"
shell.h_doctor:
  en: "check PDK, repo and supported formats"
  es: "verificar PDK, repo y formatos soportados"
shell.h_exit:
  en: "quit"
  es: "salir"
shell.h_more:
  en: "Every command accepts -f json and --help (e.g. 'diff --help')."
  es: "Todos los comandos aceptan -f json y --help (p. ej. 'diff --help')."
help.about:
  en: "Riku: semantic diff of chip designs on top of Git"
  es: "Riku: diff semántico de diseños de chips sobre Git"
help.long_about:
  en: "Riku compares versions of a chip design stored in Git: Xschem schematics (.sch), layouts (.gds, .oas, .mag) and ngspice simulations (.raw). Without a command it opens an interactive shell."
  es: "Riku compara versiones de un diseño de chip guardado en Git: esquemáticos de Xschem (.sch), layouts (.gds, .oas, .mag) y simulaciones de ngspice (.raw). Sin comando abre un shell interactivo."
help.examples_main:
  en: "Examples:\n  riku status                      what changed on disk since HEAD\n  riku diff                        the detail of those changes\n  riku diff HEAD~1 HEAD amp.sch    one file between two commits\n  riku show HEAD -f json           the last commit, as JSON\n  riku log -n 10 --graph           history with the branch graph\n  riku doctor -f json              supported formats and environment\n\nFor scripts and agents: -f json in every command (with `schema`);\nexit codes 0 no changes, 1 functional changes, 2 error with --ci (status always).\nLanguage: RIKU_LANG=es for Spanish."
  es: "Ejemplos:\n  riku status                      qué cambió en el disco respecto a HEAD\n  riku diff                        el detalle de esos cambios\n  riku diff HEAD~1 HEAD amp.sch    un archivo entre dos commits\n  riku show HEAD -f json           el último commit, en JSON\n  riku log -n 10 --graph           historial con el grafo de ramas\n  riku doctor -f json              formatos soportados y entorno\n\nPara scripts y agentes: -f json en todos los comandos (con `schema`);\ncódigos 0 sin cambios, 1 cambios funcionales, 2 error con --ci (status siempre).\nIdioma: RIKU_LANG=en para inglés."
help.jobs:
  en: "Threads for heavy work (layout diff, viewer loading). Default: available cores (also RIKU_JOBS). Set at startup; it does not change inside the shell."
  es: "Hilos para el trabajo pesado (diff de layouts, carga del visor). Por defecto, los núcleos disponibles (también: RIKU_JOBS). Se fija al arrancar; en el shell no cambia."
help.repo:
  en: "Repository (default: the current folder)."
  es: "Repositorio (por defecto, la carpeta actual)."
help.diff:
  en: "Compare two versions (commits or the working tree), of one file or all of them."
  es: "Compara dos versiones (commits o el working tree), de un archivo o de todos."
help.diff_targets:
  en: "[A] [B] [FILE]. Without B, compare against the working tree (the disk); without A, against HEAD; without FILE, every file that changed."
  es: "[A] [B] [ARCHIVO]. Sin B, se compara contra el working tree (el disco); sin A, contra HEAD; sin ARCHIVO, todos los archivos que cambiaron."
help.format_diff:
  en: "text, json (schema riku-diff/v2; riku-diff-set/v1 without a file), json-v1 (previous shape, one file) or visual (opens the viewer)."
  es: "text, json (schema riku-diff/v2; riku-diff-set/v1 sin archivo), json-v1 (forma anterior, un archivo) o visual (abre el visor)."
help.cosmetic:
  en: "Area in µm² under which a layout change is cosmetic (sub-DRC). Default 0.01 µm² (below the DRC floor of PDKs like sky130 and gf180), or the one in .riku.toml. Other formats ignore it."
  es: "Área en µm² bajo la cual un cambio de layout es cosmético (sub-DRC). Por defecto 0.01 µm² (debajo del piso DRC de PDKs como sky130 y gf180), o la de .riku.toml. Los demás formatos lo ignoran."
help.tolerance:
  en: "Waveform tolerance: fraction of each signal's range (0.005) or percentage (0.5%). Default 0.1%, or the one in .riku.toml."
  es: "Tolerancia de formas de onda: fracción del rango de cada señal (0.005) o porcentaje (0.5%). Por defecto 0,1 %, o la de .riku.toml."
help.no_cache:
  en: "Do not use or save the diff cache of large layouts (also RIKU_NO_CACHE=1)."
  es: "No usar ni guardar la cache de diffs de layouts grandes (también: RIKU_NO_CACHE=1)."
help.expr:
  en: "Computed signal to compare besides the file's (repeatable), with ngspice syntax: --expr \"v(out)/v(in)\", --expr \"gain = db(v(out))\", --expr \"max(v(out))\". Simulation results (.raw) only; see docs/spice.md."
  es: "Señal calculada a comparar además de las del archivo (se puede repetir), con la sintaxis de ngspice: --expr \"v(out)/v(in)\", --expr \"gain = db(v(out))\", --expr \"max(v(out))\". Solo para resultados de simulación (.raw); ver docs/spice.md."
help.ci:
  en: "CI exit codes: 0 no changes or cosmetic only, 1 functional changes, 2 error."
  es: "Códigos de salida para CI: 0 sin cambios o solo cosméticos, 1 cambios funcionales, 2 error."
help.examples_diff:
  en: "Examples:\n  riku diff                          working tree against HEAD, every file\n  riku diff amp.sch                  that file, working tree against HEAD\n  riku diff main                     working tree against main\n  riku diff HEAD~1 HEAD              everything that changed between two commits\n  riku diff HEAD~1 HEAD top.gds -f json\n  riku diff v1 v2 tb.raw --expr \"gain = v(out)/v(in)\"\n  riku diff HEAD amp.sch -f visual   open the viewer (A = HEAD, B = disk)\n\nAn argument is a FILE if Riku knows its extension or it exists on disk;\notherwise it is a commit (hash, branch, tag, HEAD~2)."
  es: "Ejemplos:\n  riku diff                          working tree contra HEAD, todos los archivos\n  riku diff amp.sch                  ese archivo, working tree contra HEAD\n  riku diff main                     working tree contra main\n  riku diff HEAD~1 HEAD              todo lo que cambió entre dos commits\n  riku diff HEAD~1 HEAD top.gds -f json\n  riku diff v1 v2 tb.raw --expr \"gain = v(out)/v(in)\"\n  riku diff HEAD amp.sch -f visual   abrir el visor (A = HEAD, B = disco)\n\nUn argumento es un ARCHIVO si Riku conoce su extensión o existe en el disco;\nsi no, es un commit (hash, rama, tag, HEAD~2)."
help.show:
  en: "Show the semantic changes of a commit against its parent."
  es: "Muestra los cambios semánticos de un commit respecto a su padre."
help.show_commit:
  en: "Commit (hash, branch, HEAD~2…)."
  es: "Commit (hash, rama, HEAD~2…)."
help.show_file:
  en: "Only this file; without it, every file the commit changed."
  es: "Solo este archivo; sin él, todos los que cambió el commit."
help.format_show:
  en: "text, json (schema riku-show/v1) or visual (needs the file)."
  es: "text, json (schema riku-show/v1) o visual (necesita el archivo)."
help.examples_show:
  en: "Examples:\n  riku show HEAD                   the last commit against its parent\n  riku show a3f2b1c amp.sch        only that file\n  riku show HEAD -f json --ci      JSON, and exit code 1 if there are functional changes"
  es: "Ejemplos:\n  riku show HEAD                   el último commit contra su padre\n  riku show a3f2b1c amp.sch        solo ese archivo\n  riku show HEAD -f json --ci      JSON y código 1 si hay cambios funcionales"
help.log:
  en: "List commits with a semantic summary per file."
  es: "Lista commits con un resumen semántico por archivo."
help.log_file:
  en: "Only commits that touch this file (like --paths)."
  es: "Solo los commits que tocan este archivo (como --paths)."
help.limit:
  en: "How many commits (default 20)."
  es: "Cuántos commits (por defecto 20)."
help.format_list:
  en: "text or json (with a versioned schema)."
  es: "text o json (con schema versionado)."
help.compact:
  en: "Compact JSON (one line); indented by default."
  es: "JSON compacto (una línea); por defecto, con sangría."
help.detail:
  en: "More detail: one entry per changed component, net or signal."
  es: "Más detalle: una entrada por componente, net o señal cambiada."
help.full:
  en: "Print each module's full report per file."
  es: "Imprime el reporte completo del módulo por archivo."
help.paths:
  en: "Filter by glob (repeatable). E.g. --paths 'amp_*.sch'."
  es: "Filtra por glob (se puede repetir). Ej.: --paths 'amp_*.sch'."
help.branch:
  en: "Start from another ref/oid instead of HEAD."
  es: "Empieza desde otra ref/oid en lugar de HEAD."
help.graph:
  en: "Draw the branch and merge graph on the left (topological order). With -f json, adds each commit's place in the graph."
  es: "Dibuja el grafo de ramas y merges a la izquierda (orden topológico). Con -f json agrega el lugar de cada commit en el grafo."
help.ascii:
  en: "Graph with ASCII characters instead of Unicode (also RIKU_ASCII=1)."
  es: "Grafo con caracteres ASCII en vez de Unicode (también: RIKU_ASCII=1)."
help.examples_log:
  en: "Examples:\n  riku log                         the last 20 commits\n  riku log amp.sch -n 5 --detail   one file, with every changed component\n  riku log --graph                 with the branch and merge graph\n  riku log -f json --compact       JSON on one line"
  es: "Ejemplos:\n  riku log                         los últimos 20 commits\n  riku log amp.sch -n 5 --detail   un archivo, con cada componente cambiado\n  riku log --graph                 con el grafo de ramas y merges\n  riku log -f json --compact       JSON en una línea"
help.doctor:
  en: "Check the environment and list the formats this riku can compare."
  es: "Verifica el entorno y lista los formatos que este riku sabe comparar."
help.status:
  en: "Summarize the working tree changes against HEAD."
  es: "Resume los cambios del working tree respecto a HEAD."
help.include_unknown:
  en: "Also list the files no module recognizes."
  es: "Lista también los archivos que ningún módulo reconoce."
help.status_ci:
  en: "No effect: status always uses CI exit codes (0 clean, 1 functional changes, 2 error). Accepted for uniformity."
  es: "Sin efecto: status siempre usa los códigos de CI (0 limpio, 1 cambios funcionales, 2 error). Se acepta por uniformidad."
help.examples_status:
  en: "Examples:\n  riku status                      summary per file\n  riku status --detail             with every component, net or signal\n  riku status -f json              JSON (schema riku-status/v1)\n\nExit code: 0 no changes or cosmetic only, 1 functional changes, 2 error."
  es: "Ejemplos:\n  riku status                      resumen por archivo\n  riku status --detail             con cada componente, net o señal\n  riku status -f json              JSON (schema riku-status/v1)\n\nCódigo de salida: 0 sin cambios o solo cosméticos, 1 cambios funcionales, 2 error."
help.completions:
  en: "Print shell completion: riku completions bash > ~/.local/share/bash-completion/completions/riku"
  es: "Imprime el autocompletado para una shell: riku completions bash > ~/.local/share/bash-completion/completions/riku"
help.shell:
  en: "bash, zsh, fish, powershell or elvish."
  es: "bash, zsh, fish, powershell o elvish."
help.open:
  en: "Open a .sch, .gds, .oas, .mag or .raw file in the desktop viewer."
  es: "Abre un archivo .sch, .gds, .oas, .mag o .raw en el visor de escritorio."
help.gui:
  en: "Run the viewer in this process: riku gui [file] [--cell CELL]. open and diff -f visual use it underneath."
  es: "Abre el visor en este proceso: riku gui [archivo] [--cell CELDA]. open y diff -f visual lo usan por debajo."
diff.failed:
  en: "could not compare:"
  es: "no se pudo comparar:"
