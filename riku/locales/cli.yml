  es: "Módulos de formato"
doctor.ready:
  en: "Environment ready."
  es: "Entorno listo."
doctor.xschemrc_missing:
  en: ".xschemrc: not found"
  es: ".xschemrc: no encontrado"
doctor.pdk_missing:
  en: "$PDK_ROOT/$PDK set but path not found: %{path}"
  es: "$PDK_ROOT/$PDK configurado pero ruta no encontrada: %{path}"
doctor.pdk_detected:
  en: "$PDK not set: detected from each schematic's symbols\n        (installed in %{root}: %{list}). To pin it: sak-pdk <name> (or export PDK=<name>)"
  es: "$PDK no definida: se detecta por los símbolos de cada esquemático\n        (instalados en %{root}: %{list}). Para fijarlo: sak-pdk <nombre> (o export PDK=<nombre>)"
doctor.pdk_none:
  en: "$PDK_ROOT / $PDK: not set and no PDKs in /foss/pdks"
  es: "$PDK_ROOT / $PDK: no configurados y no hay PDKs en /foss/pdks"
doctor.magic_none:
  en: "Magic: no .mag libraries in the PDK (cells used must be in the repo or in $RIKU_MAG_PATH)"
  es: "Magic: sin librerías .mag en el PDK (las celdas usadas deben estar en el repo o en $RIKU_MAG_PATH)"
doctor.magic_libs:
  en: "Magic: .mag libraries in %{list}"
  es: "Magic: librerías .mag en %{list}"
doctor.tools_missing:
  en: "$TOOLS set but devices not found: %{path}"
  es: "$TOOLS configurado pero devices no encontrado: %{path}"
doctor.tools_none:
  en: "$TOOLS: not set"
  es: "$TOOLS: no configurado"
