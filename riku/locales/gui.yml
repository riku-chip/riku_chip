# Textos del visor (riku gui). Cada clave lleva `en` y `es`; el inglés es el
# idioma por defecto y el de respaldo. Variables: %{nombre}.
# El test `gui::i18n::tests::every_key_has_both_languages` verifica que
# ninguna clave quede sin alguno de los dos idiomas.
_version: 2

