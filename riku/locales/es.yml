help.about: "Riku: diff semántico de diseños de chips sobre Git"
help.long_about: "Riku compara versiones de un diseño de chip guardado en Git: esquemáticos de Xschem (.sch), layouts (.gds, .oas, .mag) y simulaciones de ngspice (.raw). Sin comando abre un shell interactivo."
help.examples_main: "Ejemplos:\n  riku status                      qué cambió en el disco respecto a HEAD\n  riku diff                        el detalle de esos cambios\n  riku diff HEAD~1 HEAD amp.sch    un archivo entre dos commits\n  riku show HEAD -f json           el último commit, en JSON\n  riku log -n 10 --graph           historial con el grafo de ramas\n  riku doctor -f json              formatos soportados y entorno\n\nPara scripts y agentes: -f json en todos los comandos (con `schema`);\ncódigos 0 sin cambios, 1 cambios funcionales, 2 error con --ci (status siempre).\nIdioma: RIKU_LANG=en para inglés."
help.jobs: "Hilos para el trabajo pesado (diff de layouts, carga del visor). Por defecto, los núcleos disponibles (también: RIKU_JOBS). Se fija al arrancar; en el shell no cambia."
help.repo: "Repositorio (por defecto, la carpeta actual)."
help.diff: "Compara dos versiones (commits o el working tree), de un archivo o de todos."
help.diff_targets: "[A] [B] [ARCHIVO]. Sin B, se compara contra el working tree (el disco); sin A, contra HEAD; sin ARCHIVO, todos los archivos que cambiaron."
help.format_diff: "text, json (schema riku-diff/v2; riku-diff-set/v1 sin archivo) o visual (abre el visor), png o svg (imagen del diff; imprime la ruta)."
help.cosmetic: "Área en µm² bajo la cual un cambio de layout es cosmético (sub-DRC). Por defecto 0.01 µm² (debajo del piso DRC de PDKs como sky130 y gf180), o la de .riku.toml. Los demás formatos lo ignoran."
help.tolerance: "Tolerancia de formas de onda: fracción del rango de cada señal (0.005) o porcentaje (0.5%). Por defecto 0,1 %, o la de .riku.toml."
help.no_cache: "No usar ni guardar la cache de diffs de layouts grandes (también: RIKU_NO_CACHE=1)."
help.expr: "Señal calculada a comparar además de las del archivo (se puede repetir), con la sintaxis de ngspice: --expr \"v(out)/v(in)\", --expr \"gain = db(v(out))\", --expr \"max(v(out))\". Solo para resultados de simulación (.raw); ver docs/formatos.md."
help.ci: "Códigos de salida para CI: 0 sin cambios o solo cosméticos, 1 cambios funcionales, 2 error."
help.examples_diff: "Ejemplos:\n  riku diff                          working tree contra HEAD, todos los archivos\n  riku diff amp.sch                  ese archivo, working tree contra HEAD\n  riku diff main                     working tree contra main\n  riku diff HEAD~1 HEAD              todo lo que cambió entre dos commits\n  riku diff HEAD~1 HEAD top.gds -f json\n  riku diff v1 v2 tb.raw --expr \"gain = v(out)/v(in)\"\n  riku diff HEAD amp.sch -f visual   abrir el visor (A = HEAD, B = disco)\n\nUn argumento es un ARCHIVO si Riku conoce su extensión o existe en el disco;\nsi no, es un commit (hash, rama, tag, HEAD~2)."
help.show: "Muestra los cambios semánticos de un commit respecto a su padre."
help.show_commit: "Commit (hash, rama, HEAD~2…)."
help.show_file: "Solo este archivo; sin él, todos los que cambió el commit."
help.format_show: "text, json (schema riku-show/v1) visual, png o svg (necesitan el archivo)."
help.examples_show: "Ejemplos:\n  riku show HEAD                   el último commit contra su padre\n  riku show a3f2b1c amp.sch        solo ese archivo\n  riku show HEAD -f json --ci      JSON y código 1 si hay cambios funcionales"
help.log: "Lista commits con un resumen semántico por archivo."
help.log_file: "Solo los commits que tocan este archivo (como --paths)."
help.limit: "Cuántos commits (por defecto 20)."
help.format_list: "text o json (con schema versionado)."
help.compact: "JSON compacto (una línea); por defecto, con sangría."
help.detail: "Más detalle: una entrada por componente, net o señal cambiada."
help.full: "Imprime el reporte completo del módulo por archivo."
help.paths: "Filtra por glob (se puede repetir). Ej.: --paths 'amp_*.sch'."
help.branch: "Empieza desde otra ref/oid en lugar de HEAD."
help.graph: "Dibuja el grafo de ramas y merges a la izquierda (orden topológico). Con -f json agrega el lugar de cada commit en el grafo."
help.ascii: "Grafo con caracteres ASCII en vez de Unicode (también: RIKU_ASCII=1)."
help.examples_log: "Ejemplos:\n  riku log                         los últimos 20 commits\n  riku log amp.sch -n 5 --detail   un archivo, con cada componente cambiado\n  riku log --graph                 con el grafo de ramas y merges\n  riku log -f json --compact       JSON en una línea"
help.doctor: "Verifica el entorno y lista los formatos que este riku sabe comparar."
help.status: "Resume los cambios del working tree respecto a HEAD."
help.include_unknown: "Lista también los archivos que ningún módulo reconoce."
help.status_ci: "Sin efecto: status siempre usa los códigos de CI (0 limpio, 1 cambios funcionales, 2 error). Se acepta por uniformidad."
help.examples_status: "Ejemplos:\n  riku status                      resumen por archivo\n  riku status --detail             con cada componente, net o señal\n  riku status -f json              JSON (schema riku-status/v2)\n\nCódigo de salida: 0 sin cambios o solo cosméticos, 1 cambios funcionales, 2 error."
help.completions: "Imprime el autocompletado para una shell: riku completions bash > ~/.local/share/bash-completion/completions/riku"
help.shell: "bash, zsh, fish, powershell o elvish."
help.open: "Abre un archivo en el visor de escritorio (%{exts})."
help.gui: "Abre el visor en este proceso: riku gui [archivo] [--cell CELDA]. open y diff -f visual lo usan por debajo."
