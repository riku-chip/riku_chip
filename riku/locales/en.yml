# Riku texts in English: the default language and the fallback for missing
# translations. To add a language, copy this file to <code>.yml (e.g. pt.yml),
# translate the values (never the keys) and set lang.name. See
# docs/desarrollo.md, "Traducciones". Variables look like %{name}: keep them.

