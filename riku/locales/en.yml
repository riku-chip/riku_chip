help.about: "Riku: semantic diff of chip designs on top of Git"
help.long_about: "Riku compares versions of a chip design stored in Git: Xschem schematics (.sch), layouts (.gds, .oas, .mag) and ngspice simulations (.raw). Without a command it opens an interactive shell."
help.examples_main: "Examples:\n  riku status                      what changed on disk since HEAD\n  riku diff                        the detail of those changes\n  riku diff HEAD~1 HEAD amp.sch    one file between two commits\n  riku show HEAD -f json           the last commit, as JSON\n  riku log -n 10 --graph           history with the branch graph\n  riku doctor -f json              supported formats and environment\n\nFor scripts and agents: -f json in every command (with `schema`);\nexit codes 0 no changes, 1 functional changes, 2 error with --ci (status always).\nLanguage: RIKU_LANG=es for Spanish."
help.jobs: "Threads for heavy work (layout diff, viewer loading). Default: available cores (also RIKU_JOBS). Set at startup; it does not change inside the shell."
help.repo: "Repository (default: the current folder)."
help.diff: "Compare two versions (commits or the working tree), of one file or all of them."
help.diff_targets: "[A] [B] [FILE]. Without B, compare against the working tree (the disk); without A, against HEAD; without FILE, every file that changed."
help.format_diff: "text, json (schema riku-diff/v2; riku-diff-set/v1 without a file) or visual (opens the viewer), png or svg (an image of the diff; prints its path)."
help.cosmetic: "Area in µm² under which a layout change is cosmetic (sub-DRC). Default 0.01 µm² (below the DRC floor of PDKs like sky130 and gf180), or the one in .riku.toml. Other formats ignore it."
help.tolerance: "Waveform tolerance: fraction of each signal's range (0.005) or percentage (0.5%). Default 0.1%, or the one in .riku.toml."
help.no_cache: "Do not use or save the diff cache of large layouts (also RIKU_NO_CACHE=1)."
help.expr: "Computed signal to compare besides the file's (repeatable), with ngspice syntax: --expr \"v(out)/v(in)\", --expr \"gain = db(v(out))\", --expr \"max(v(out))\". Simulation results (.raw) only; see docs/formatos.md."
help.ci: "CI exit codes: 0 no changes or cosmetic only, 1 functional changes, 2 error."
help.examples_diff: "Examples:\n  riku diff                          working tree against HEAD, every file\n  riku diff amp.sch                  that file, working tree against HEAD\n  riku diff main                     working tree against main\n  riku diff HEAD~1 HEAD              everything that changed between two commits\n  riku diff HEAD~1 HEAD top.gds -f json\n  riku diff v1 v2 tb.raw --expr \"gain = v(out)/v(in)\"\n  riku diff HEAD amp.sch -f visual   open the viewer (A = HEAD, B = disk)\n\nAn argument is a FILE if Riku knows its extension or it exists on disk;\notherwise it is a commit (hash, branch, tag, HEAD~2)."
help.show: "Show the semantic changes of a commit against its parent."
help.show_commit: "Commit (hash, branch, HEAD~2…)."
help.show_file: "Only this file; without it, every file the commit changed."
help.format_show: "text, json (schema riku-show/v1) visual, png or svg (need the file)."
help.examples_show: "Examples:\n  riku show HEAD                   the last commit against its parent\n  riku show a3f2b1c amp.sch        only that file\n  riku show HEAD -f json --ci      JSON, and exit code 1 if there are functional changes"
help.log: "List commits with a semantic summary per file."
help.log_file: "Only commits that touch this file (like --paths)."
help.limit: "How many commits (default 20)."
help.format_list: "text or json (with a versioned schema)."
help.compact: "Compact JSON (one line); indented by default."
help.detail: "More detail: one entry per changed component, net or signal."
help.full: "Print each module's full report per file."
help.paths: "Filter by glob (repeatable). E.g. --paths 'amp_*.sch'."
help.branch: "Start from another ref/oid instead of HEAD."
help.graph: "Draw the branch and merge graph on the left (topological order). With -f json, adds each commit's place in the graph."
help.ascii: "Graph with ASCII characters instead of Unicode (also RIKU_ASCII=1)."
help.examples_log: "Examples:\n  riku log                         the last 20 commits\n  riku log amp.sch -n 5 --detail   one file, with every changed component\n  riku log --graph                 with the branch and merge graph\n  riku log -f json --compact       JSON on one line"
help.doctor: "Check the environment and list the formats this riku can compare."
help.status: "Summarize the working tree changes against HEAD."
help.include_unknown: "Also list the files no module recognizes."
help.status_ci: "No effect: status always uses CI exit codes (0 clean, 1 functional changes, 2 error). Accepted for uniformity."
help.examples_status: "Examples:\n  riku status                      summary per file\n  riku status --detail             with every component, net or signal\n  riku status -f json              JSON (schema riku-status/v2)\n\nExit code: 0 no changes or cosmetic only, 1 functional changes, 2 error."
help.completions: "Print shell completion: riku completions bash > ~/.local/share/bash-completion/completions/riku"
