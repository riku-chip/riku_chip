[package]
name = "riku"
version = "0.1.0"
edition = "2024"
description = "VCS semantico para diseno de chips"
authors = ["euler <carlos.cuevaleon@gmail.com>", "Adriel2503 <Adriel2503@users.noreply.github.com>"]
license = "MIT"
default-run = "riku"

[lib]
name = "riku"
path = "src/lib.rs"

[[bin]]
name = "riku"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
dirs = "6.0.0"
# Sin features por defecto: Riku solo lee repos locales, no necesita https/ssh (OpenSSL, libssh2).
git2 = { version = "0.20.4", default-features = false }
glob = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
riku-kernel = { path = "../riku-kernel" }
thiserror = "2.0.18"
rustyline = "14.0"
# xschem-viewer-rust vive como submodule git en `external/`. Esto permite
# `git clone --recurse-submodules` y compilar sin pasos extra. Al publicar
# viewer-core en crates.io, esto puede migrarse a una git/crates dependency.
xschem_viewer = { package = "xschem-viewer", path = "../external/xschem-viewer-rust", optional = true }
# Módulo de layouts: riku-mod-layout encapsula gdstk_rs (diff geométrico y visor).
riku-mod-layout = { path = "../riku-mod-layout", optional = true }
# Contrato del visor (los módulos ofrecen su backend).
viewer-core = { path = "../viewer-core" }

# ── Visor de escritorio (feature `gui`, activada por defecto) ──────────────
eframe = { version = "0.34.1", default-features = false, features = ["glow", "x11", "wayland", "persistence"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
poll-promise = { version = "0.3", features = ["tokio"], optional = true }
# Triangulación de polígonos cóncavos (egui solo rellena convexos).
earcutr = { version = "0.5", optional = true }
async-trait = { version = "0.1", optional = true }

[features]
default = ["xschem", "layout", "gui"]
# Módulos de formato (ver src/modules/mod.rs).
xschem = ["dep:xschem_viewer"]
layout = ["dep:riku-mod-layout"]
# Visor de escritorio. Sin `gui` sale un `riku` solo de terminal (servidores,
# CI), sin egui. Cada módulo aporta su visor (ver FormatModule::viewer).
gui = ["dep:eframe", "dep:tokio", "dep:poll-promise", "dep:earcutr", "dep:async-trait"]

[dev-dependencies]
tempfile = "3.27.0"

# Paquete .deb (cargo-deb), generado por .github/workflows/release.yml.
[package.metadata.deb]
name = "riku"
section = "electronics"
priority = "optional"
extended-description = "Diff semántico de esquemáticos Xschem y diff geométrico de layouts GDS/OASIS entre commits de Git, con visor de escritorio (riku gui)."
depends = "$auto"
assets = [
    ["target/release/riku", "usr/bin/", "755"],
    ["../packaging/riku.desktop", "usr/share/applications/", "644"],
    ["../packaging/riku.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../README.md", "usr/share/doc/riku/README.md", "644"],
]
