[package]
name = "viewer-core"
version = "0.1.0"
edition = "2021"
description = "Abstracciones neutras para visores de layout/esquemático (Xschem, GDS, ...)"
license = "MIT"

[dependencies]
async-trait = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
# Triangulación de polígonos cóncavos (fill.rs, index.rs).
earcutr = "0.5"
# Armado del índice en paralelo (feature `parallel`).
rayon = { version = "1", optional = true }

[features]
parallel = ["dep:rayon"]
